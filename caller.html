<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farm Girl Designs Bingo Caller</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:
 radial-gradient(circle at 10% 10%,#fff 0 3%,transparent 4%),
 linear-gradient(135deg,#ff4fa3,#ff9bd0 45%,#25d9d0);
 min-height:100vh;color:#35162d
}
.container{max-width:720px;margin:auto;padding:14px}
.header{
 background:#fff;border:5px solid #ff4fa3;border-radius:28px;
 padding:16px;text-align:center;box-shadow:0 8px 20px #54103d55
}
.logo{font-size:42px}
h1{margin:3px;color:#ed318e;font-size:28px}
.sub{font-weight:900;color:#159d99;font-size:18px}
.current{
 margin:15px 0;padding:18px;text-align:center;
 background:#35162d;color:white;border:4px solid #ffd0e7;
 border-radius:25px;box-shadow:0 8px 20px #42112e66
}
.label{font-weight:900;letter-spacing:2px}
.letter{font-size:32px;color:#ffe06a;font-weight:900}
.number{font-size:82px;font-weight:900;line-height:1}
button{
 border:0;border-radius:14px;padding:13px 8px;
 font-size:16px;font-weight:900;cursor:pointer
}
.reset{background:#fff;color:#35162d;margin-top:12px;padding:13px 22px}
.section{
 background:#fff;border:4px solid #25d9d0;border-radius:22px;
 padding:14px;margin-top:14px;box-shadow:0 6px 18px #54103d44
}
.title{text-align:center;font-size:19px;font-weight:900;color:#bd176d;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.ball{
 background:#fff;border:3px solid #ddd;color:#35162d;
 min-height:55px
}
.ball.called{background:#ff4fa3;color:white;border-color:#b71869}
.ball.last{outline:4px solid #ffd34e}
.called{
 line-height:1.9;font-size:15px;font-weight:700;
 word-break:break-word
}
@media(min-width:600px){.grid{grid-template-columns:repeat(10,1fr)}}
</style>
</head>
